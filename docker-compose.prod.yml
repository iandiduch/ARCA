services:
  postgres:
    image: postgres:16-alpine
    container_name: arca_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arca_db}
      POSTGRES_USER: ${POSTGRES_USER:-arca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - arca_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arca_user} -d ${POSTGRES_DB:-arca_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arca_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-arca_user}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arca_db}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
      DATABASE_LOCK_MAX_CONNECTIONS: ${DATABASE_LOCK_MAX_CONNECTIONS:-10}
      FISCAL_LOCK_TIMEOUT_MS: ${FISCAL_LOCK_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY_MASTER: ${API_KEY_MASTER:?Defina API_KEY_MASTER (openssl rand -hex 32)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY (openssl rand -hex 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ARCA_DEFAULT_ENVIRONMENT: ${ARCA_DEFAULT_ENVIRONMENT:-production}
      ARCA_PLATFORM_CUIT: ${ARCA_PLATFORM_CUIT}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_MAX_SENDS_PER_INVOICE: ${EMAIL_MAX_SENDS_PER_INVOICE:-5}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    networks:
      - dokploy-network
      - default

volumes:
  arca_postgres_data:
    driver: local

networks:
  dokploy-network:
    external: true
